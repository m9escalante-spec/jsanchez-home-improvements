name: Test and deploy to GitHub Pages

# Every push to main runs the backend tests, then publishes the public site
# files to the gh-pages branch, which GitHub Pages serves.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Backend tests
        run: TZ=America/New_York node tests/apps-script.test.mjs

      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml css js images fonts _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
